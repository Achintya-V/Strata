[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-memory"
version = "0.3.0"
description = "Git-native memory layer for any chatbot: Mem0-shaped API over plain markdown + git, with a bi-temporal claim ledger, provenance typing, and compliance-grade erasure."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.5",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "filelock>=3.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
mcp = ["mcp>=1.0.0"]
vector = ["sqlite-vec>=0.1.3", "model2vec>=0.3"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8.0.0"]

[project.scripts]
strata = "strata.cli:app"

[tool.setuptools.packages.find]
include = ["strata*"]

[tool.setuptools.package-data]
strata = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
