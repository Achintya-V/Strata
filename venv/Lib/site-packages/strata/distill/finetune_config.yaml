# Strata Distillation — Fine-tuning Configuration
# This file is the mutable genome in the AutoResearch loop.
# Change ONE variable per experiment iteration.

base_model: "Qwen/Qwen2.5-7B-Instruct"
quantization: "4bit"

lora:
  rank: 16
  alpha: 32       # always 2x rank
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3
  learning_rate: 2.0e-4
  lr_schedule: "cosine"
  warmup_ratio: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  max_seq_length: 2048
  packing: true
  bf16: true

data:
  task: "extraction"
  min_quality_score: 0.8
  heuristic_diverged_only: false

output:
  format: "gguf"
  quantization: "Q4_K_M"
  output_dir: "~/.strata/models"
